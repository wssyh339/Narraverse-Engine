project_doc_max_bytes = 65536
project_doc_fallback_filenames = []

[mcp_servers.codebase_memory]
enabled = true
required = false
command = "./scripts/code-intel.sh"
args = ["mcp"]
cwd = "."
startup_timeout_sec = 30
tool_timeout_sec = 60
default_tools_approval_mode = "auto"
enabled_tools = [
  "search_graph",
  "query_graph",
  "trace_path",
  "get_code_snippet",
  "get_graph_schema",
  "get_architecture",
  "search_code",
  "index_status",
]
