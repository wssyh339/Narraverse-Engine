name: Contract Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend-contracts:
    name: Backend contract tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run backend contracts
        run: python -m pytest backend/tests/test_core_apis.py backend/tests/test_agent_prompt_runtime_contract.py -q

  frontend-contracts:
    name: Frontend contract tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm@11.5.1
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run frontend contracts
        working-directory: frontend
        run: node --test tests/agents-page-contract.test.mjs tests/frontend-contract.test.mjs
