name: AI Context Full Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-verification:
    name: Pinned AI context integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.14.0"

      - name: Install pinned code graph binary
        run: ./scripts/code-intel.sh install

      - name: Run full local-tool integration verification
        run: ./scripts/verify-ai-context.sh --full
