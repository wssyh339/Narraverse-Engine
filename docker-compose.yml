services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:///./data/novel_agent.db
      JOB_ARTIFACT_DIR: artifacts/runs
      FRONTEND_ORIGIN: http://localhost:5173
    volumes:
      - backend_data:/app/data
      - backend_artifacts:/app/artifacts

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000/api
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  backend_data:
  backend_artifacts:
